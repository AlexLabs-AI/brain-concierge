# Brain Concierge Eval Suite — 20 side-by-side comparisons
# brain_concierge (task-first) vs. raw GBrain query (baseline)
#
# Run: promptfoo eval --config evals/promptfooconfig.yaml --env-file .env.eval
# View: promptfoo view

description: "Brain Concierge vs. Raw GBrain Baseline — 20 comparisons"

# ─── Prompts ──────────────────────────────────────────────────────────────────
# The task string IS the prompt — both providers receive it as input.
prompts:
  - "{{task}}"

# ─── Providers ────────────────────────────────────────────────────────────────

providers:
  - id: "http"
    label: "brain_concierge (task-first)"
    config:
      url: "{{ env.CONCIERGE_URL }}/mcp"
      method: POST
      headers:
        Content-Type: application/json
        Accept: "application/json, text/event-stream"
        Authorization: "Bearer {{ env.CONCIERGE_TOKEN }}"
      body: >
        {
          "jsonrpc": "2.0",
          "id": 1,
          "method": "tools/call",
          "params": {
            "name": "brain_concierge",
            "arguments": {
              "task": "{{task}}",
              "agent_role": "{{agent_role}}"
            }
          }
        }
      transformResponse: "json?.result?.content?.[0]?.text || text"

  - id: "http"
    label: "gbrain query (raw baseline)"
    config:
      url: "{{ env.GBRAIN_URL }}/mcp"
      method: POST
      headers:
        Content-Type: application/json
        Accept: "application/json, text/event-stream"
        Authorization: "Bearer {{ env.GBRAIN_TOKEN }}"
      body: >
        {
          "jsonrpc": "2.0",
          "id": 1,
          "method": "tools/call",
          "params": {
            "name": "query",
            "arguments": {
              "query": "{{task}}",
              "limit": 8
            }
          }
        }
      transformResponse: "file://gbrain-transform.js"

# ─── Shared defaults ──────────────────────────────────────────────────────────

defaultTest:
  vars:
    agent_role: "operational AI agent"

# ─── 20 test cases ────────────────────────────────────────────────────────────

tests:

  - description: "1. Designing a new CS agent for Lifeforce"
    vars:
      task: "I am Atlas Voss, Chief Agentic Engineer. I am about to design a new customer success agent for the Lifeforce Financial fleet. My goal is to understand what agent patterns, memory schemas, and tool sets are appropriate for a CS agent in this operating system."
      agent_role: "agentic engineer"
    assert:
      - type: llm-rubric
        value: "Response contains relevant knowledge about agent architecture, memory design, or tool selection. Higher score if it surfaces patterns or prior decisions relevant to Lifeforce or CS agents."

  - description: "2. Context window economics — what goes where"
    vars:
      task: "I am designing the system prompt for a new research agent. I need to decide what belongs in SOUL.md versus MEMORY.md versus the knowledge base versus session context. My goal is to apply correct context window economics for production agents."
      agent_role: "agentic engineer"
    assert:
      - type: llm-rubric
        value: "Response surfaces relevant principles about context window design, token economics, or memory architecture. Bonus for referencing thin harness / fat skills or Garry Tan's architecture."

  - description: "3. Orchestrator vs. peer agent pattern"
    vars:
      task: "I need to decide between an orchestrator-subagent pattern and a peer agent pattern for a new parallel content publishing workflow. My goal is to pick the right coordination pattern and understand the tradeoffs."
      agent_role: "agentic engineer"
    assert:
      - type: llm-rubric
        value: "Response explains orchestrator vs. peer agent tradeoffs or provides concrete criteria for choosing between patterns."

  - description: "4. Configuring a new GBrain source"
    vars:
      task: "I am about to configure a new GBrain source for a brand recently added to the AlexLabs fleet. My goal is to understand the correct setup steps, source registration process, and any known gotchas."
      agent_role: "infrastructure engineer"
    assert:
      - type: llm-rubric
        value: "Response contains actionable information about GBrain source setup. Higher score for specific commands, configuration fields, or known issues."

  - description: "5. Deploying a new agent on headless Mac Mini"
    vars:
      task: "I am preparing a deployment brief for a new agent on a headless Mac Mini. I need the standard OpenClaw configuration, node paths, Chrome CDP setup requirements, and context pruning settings."
      agent_role: "agentic engineer"
    assert:
      - type: llm-rubric
        value: "Response surfaces relevant OpenClaw deployment information. Higher score for specific config paths, node paths, or Chrome CDP setup steps."

  - description: "6. Lifeforce Financial brand context"
    vars:
      task: "I am designing an agent for Lifeforce Financial. Before I start, I need to understand what this brand does, its operating model, the agent fleet that exists for it, and any design constraints I should know about."
      agent_role: "agentic engineer"
    assert:
      - type: llm-rubric
        value: "Response contains relevant brand context about Lifeforce Financial. Higher score for business model, fleet structure, or prior design decisions."

  - description: "7. Rockport Studios brand and content strategy"
    vars:
      task: "I am designing a content agent for Rockport Studios. I need to understand the brand's operating model, content strategy, existing agents, and what knowledge is available in the Rockport knowledge silo."
      agent_role: "agentic engineer"
    assert:
      - type: llm-rubric
        value: "Response contains relevant information about Rockport Studios. Higher score for content strategy, fleet structure, or available knowledge."

  - description: "8. Tool selection principles for a sales agent"
    vars:
      task: "I am about to define the tool set for a new sales agent. I need to apply the right principles for tool selection — how to decide what tools an agent genuinely needs, what to exclude, and how tool choice affects agent behavior and failure modes."
      agent_role: "agentic engineer"
    assert:
      - type: llm-rubric
        value: "Response surfaces relevant principles about tool selection, minimum necessary tools, or how tool sets affect agent behavior."

  - description: "9. Designing escalation chains"
    vars:
      task: "I need to design the escalation chain for a new autonomous agent. My goal is to understand what the agent can decide alone, what must escalate to a human, and how to design the hard stops correctly."
      agent_role: "agentic engineer"
    assert:
      - type: llm-rubric
        value: "Response provides relevant guidance on escalation design, authority boundaries, or hard stop patterns for autonomous agents."

  - description: "10. MCP tool reliability and error handling"
    vars:
      task: "I am about to build a set of MCP tool integrations for an agent fleet. My goal is to understand best practices for making tool-calling reliable, handling errors gracefully, and ensuring tool calls are auditable."
      agent_role: "agentic engineer"
    assert:
      - type: llm-rubric
        value: "Response contains relevant guidance on MCP tool reliability, error handling, or auditability patterns."

  - description: "11. Writing a SOUL.md that prevents identity drift"
    vars:
      task: "I am writing the SOUL.md for a new fleet agent. My goal is to design an identity that is sharp enough to prevent behavioral drift, establishes clear authority boundaries, and stays stable under adversarial prompting."
      agent_role: "agentic engineer"
    assert:
      - type: llm-rubric
        value: "Response surfaces relevant principles about agent identity design, SOUL.md structure, or how to prevent behavioral drift."

  - description: "12. Resolver pattern for context routing"
    vars:
      task: "I need to design the resolver layer for an agent that handles multiple task types. My goal is to understand how resolvers work, how to build a routing table that loads the right context at the right time, and common failure modes."
      agent_role: "agentic engineer"
    assert:
      - type: llm-rubric
        value: "Response explains the resolver pattern, routing tables, or context loading strategy. Bonus for Garry Tan's resolver design or specific implementation patterns."

  - description: "13. Building an eval suite for an agent"
    vars:
      task: "I need to build an eval suite for a new customer success agent. My goal is to understand how to design test cases, what metrics to use, how to run LLM-as-judge scoring, and what good eval coverage looks like."
      agent_role: "agentic engineer"
    assert:
      - type: llm-rubric
        value: "Response contains relevant guidance on eval design, Promptfoo usage, LLM-as-judge patterns, or what good coverage looks like for operational agents."

  - description: "14. AlexLabs fleet overview for onboarding"
    vars:
      task: "I am onboarding a new engineer to the AlexLabs agentic fleet. I need a comprehensive overview of all active agents, their roles, Tailscale IPs, and any known issues or constraints per agent."
      agent_role: "agentic engineer"
    assert:
      - type: llm-rubric
        value: "Response contains relevant fleet information — agent roster, roles, or IPs. Higher score for current, accurate, and actionable fleet context."

  - description: "15. Heartbeat monitoring agent design"
    vars:
      task: "I need to design a heartbeat agent for infrastructure monitoring. My goal is to understand the right model choice, check frequency, what to monitor, how to escalate without noise, and what the checklist should cover."
      agent_role: "agentic engineer"
    assert:
      - type: llm-rubric
        value: "Response provides relevant guidance on heartbeat agent design, model selection for monitoring, or escalation protocols that minimize noise."

  - description: "16. MEMORY.md design for a CFO agent"
    vars:
      task: "I am designing the MEMORY.md for a new CFO agent. My goal is to decide what operational facts belong in long-term memory, how to structure the admission gate, and what should never be in MEMORY.md."
      agent_role: "agentic engineer"
    assert:
      - type: llm-rubric
        value: "Response surfaces relevant principles about MEMORY.md design, memory admission criteria, or what belongs in long-term vs. ephemeral memory."

  - description: "17. Dragon Hall brand context"
    vars:
      task: "I am about to design an agent for Dragon Hall. Before I begin, I need to understand what Dragon Hall is, what it does, what operating system it uses, and what knowledge exists in its knowledge silo."
      agent_role: "agentic engineer"
    assert:
      - type: llm-rubric
        value: "Response contains relevant context about Dragon Hall. Higher score for business model, operating system, or available knowledge."

  - description: "18. Parallel subagent orchestration safety"
    vars:
      task: "I am building an orchestrator agent that spawns and manages parallel subagents for a research task. My goal is to understand safe subagent patterns — concurrency limits, timeout handling, failure recovery, and cleanup."
      agent_role: "agentic engineer"
    assert:
      - type: llm-rubric
        value: "Response provides relevant guidance on subagent orchestration, concurrency limits, timeout handling, or cleanup patterns."

  - description: "19. Edge case — zero KB coverage (adversarial)"
    vars:
      task: "I am about to design a quantum error correction system using topological qubits for a photonic quantum computer. My goal is to identify prior architectural decisions and patterns in our knowledge base."
      agent_role: "quantum computing engineer"
    assert:
      - type: llm-rubric
        value: "Response correctly identifies that the KB has no relevant coverage, rather than hallucinating plausible content. Correct behavior: acknowledge the gap clearly."

  - description: "20. Edge case — vague task (stress test)"
    vars:
      task: "I need to do agent stuff and make things better."
      agent_role: "engineer"
    assert:
      - type: llm-rubric
        value: "Response attempts to surface general agent-relevant knowledge rather than failing entirely. Tests whether task expansion helps more than raw query on a vague input."

# ─── Eval options ─────────────────────────────────────────────────────────────

evaluateOptions:
  maxConcurrency: 2
  delay: 1500

sharing: false
